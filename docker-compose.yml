services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clawd
      POSTGRES_PASSWORD: clawd
      POSTGRES_DB: clawd_agents
    ports:
      # Host port 5434 (not 5432) — this host already has an unrelated
      # Postgres container bound to 5432.
      - "5434:5432"
    volumes:
      - clawd_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host port 6380 (not 6379) — this host already has an unrelated
      # Redis container bound to 6379.
      - "6380:6379"
    volumes:
      - clawd_redis_data:/data

volumes:
  clawd_postgres_data:
  clawd_redis_data:
