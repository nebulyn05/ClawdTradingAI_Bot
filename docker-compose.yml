services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clawd
      POSTGRES_PASSWORD: clawd
      POSTGRES_DB: clawd_agents
    ports:
      - "5432:5432"
    volumes:
      - clawd_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - clawd_redis_data:/data

volumes:
  clawd_postgres_data:
  clawd_redis_data:
