# Render configuration for the Telegram bot deployment only.
# Database and Redis remain as supporting infrastructure.
# Admin, website, and worker are intentionally NOT deployed on Render.

services:
  - type: pserv
    name: clawd-postgres
    plan: starter
    region: oregon
    databases:
      - name: clawd_agents
        databaseName: clawd_agents
        user: clawd

  - type: redis
    name: clawd-redis
    plan: starter
    region: oregon

  - type: worker
    name: clawd-bot
    region: oregon
    plan: starter
    runtime: node
    repo: https://github.com/nebulyn05/ClawdTradingAI_Bot
    branch: main
    rootDir: .
    buildCommand: ./build-render.sh
    startCommand: node apps/bot/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

# Environment groups / secrets should be attached to clawd-bot only:
# DATABASE_URL, REDIS_URL, TELEGRAM_BOT_TOKEN, MASTER_ENCRYPTION_KEY,
# and the bot's chain/AI configuration.
